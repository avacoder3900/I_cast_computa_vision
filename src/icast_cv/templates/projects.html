{% extends "base.html" %}
{% set active = "projects" %}
{% block title %}Projects{% endblock %}

{% block content %}
<div class="projects-page">
    <!-- Header row -->
    <div class="projects-header">
        <h2>Projects</h2>
        <button class="btn-new-project" onclick="openNewProjectModal()">+ NEW PROJECT</button>
    </div>

    <!-- Search and sort bar -->
    <div class="projects-toolbar">
        <input type="text" id="project-search" placeholder="Search projects..." class="search-input" oninput="debounceSearch()">
        <div class="sort-group">
            <label for="sort-select">Sort by:</label>
            <select id="sort-select" onchange="loadProjects()">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="name">Name</option>
            </select>
        </div>
    </div>

    <!-- Project cards container -->
    <div id="projects-grid" class="projects-grid">
        <div class="empty-state" id="projects-empty">
            <p>No projects yet. Create your first project to get started.</p>
        </div>
    </div>

    <!-- Pagination -->
    <div class="projects-pagination" id="projects-pagination" style="display:none;">
        <span id="pagination-info">1-3 of 3</span>
        <button class="pagination-btn" id="prev-btn" onclick="prevPage()" disabled>&larr;</button>
        <button class="pagination-btn" id="next-btn" onclick="nextPage()">&rarr;</button>
    </div>
</div>

<!-- New Project Modal -->
<div class="modal-overlay" id="new-project-modal" style="display:none;" onclick="closeModalOnOverlay(event)">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Create New Project</h3>
            <button class="modal-close" onclick="closeNewProjectModal()">&times;</button>
        </div>
        <form id="new-project-form" onsubmit="createProject(event)">
            <label for="project-name">Project Name *</label>
            <input type="text" id="project-name" required minlength="1" maxlength="255" placeholder="e.g. Wax Filling Inspection">

            <label for="project-description">Description</label>
            <textarea id="project-description" rows="3" placeholder="Describe what this project inspects..."></textarea>

            <label for="project-type">Project Type</label>
            <select id="project-type">
                <option value="classification">Classification</option>
                <option value="anomaly_detection">Anomaly Detection</option>
                <option value="object_detection">Object Detection</option>
            </select>

            <label>Manufacturing Phases</label>
            <div class="phases-checkboxes" id="phases-checkboxes">
                <!-- Populated by JS -->
            </div>

            <label for="project-tags">Tags (comma-separated)</label>
            <input type="text" id="project-tags" placeholder="e.g. production, line-a">

            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeNewProjectModal()">Cancel</button>
                <button type="submit" class="btn-create">Create Project</button>
            </div>
        </form>
    </div>
</div>

<!-- Context Menu (three-dot) -->
<div class="context-menu" id="context-menu" style="display:none;">
    <button onclick="editProject()">Edit</button>
    <button onclick="duplicateProject()">Duplicate</button>
    <button onclick="deleteProject()" class="danger">Delete</button>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/projects.js"></script>
{% endblock %}

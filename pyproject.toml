[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icast-cv"
version = "0.1.0"
description = "ICast Computer Vision API — lab sample photography service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "motor>=3.6.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.4.0",
    "python-multipart>=0.0.12",
    "boto3>=1.35.0",
    "onnxruntime>=1.19.0",
    "jinja2>=3.1.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "mongomock-motor>=0.0.34",
]

[tool.hatch.build.targets.wheel]
packages = ["src/icast_cv"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "onnxruntime", "onnxruntime.*", "anomalib", "anomalib.*", "aiofiles", "aiofiles.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

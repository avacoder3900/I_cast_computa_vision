name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Type check
        run: mypy --strict src/

      - name: Run tests
        run: pytest tests/ -v
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: icast_cv_test
